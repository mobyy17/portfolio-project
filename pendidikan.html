    // tema sebelum render (tanpa kedip) + penanda JS + animasi dock hanya di kunjungan pertama
    (function () {
      // mode: tersimpan "light"/"dark", selain itu "auto" = ikuti setting perangkat
      var d = document.documentElement, t = null;
      try { t = localStorage.getItem("tema"); } catch (e) {}
      var pref = t === "light" || t === "dark" ? t : "auto";
      d.setAttribute("data-theme-pref", pref);
      d.setAttribute("data-theme", pref !== "auto" ? pref : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
      var lang = null;
      try { lang = localStorage.getItem("lang"); } catch (e) {}
      if (lang !== "id" && lang !== "en") lang = "id"; // default Indonesia; English hanya bila dipilih
      d.lang = lang;
      d.classList.add("js");
      try { if (!sessionStorage.getItem("visited")) { d.classList.add("first-visit"); sessionStorage.setItem("visited", "1"); } } catch (e) {}
      // pengaman: kalau modul JS gagal jalan, tampilkan konten tanpa animasi
      setTimeout(function () { if (!d.classList.contains("ready")) d.classList.remove("js"); }, 2500);
    })();
  </script>
